<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        /* General Styles */
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
        }
        
        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 2.5rem;
            color: #333;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .container,
        .images {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }
        
        .embed-wrapper {
            flex: 1 1 calc(33.33% - 20px);
            max-width: calc(33.33% - 20px);
            box-sizing: border-box;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .embed-wrapper:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: #6c63ff;
        }
        
        .embed-wrapper embed {
            width: 100%;
            height: 400px;
            border: none;
        }
        
        .file-title {
            padding: 15px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            background-color: #f5f7fa;
            color: #6c63ff;
            border-top: 1px solid #ddd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Responsive Adjustments */
        
        @media screen and (max-width: 768px) {
            .embed-wrapper {
                flex: 1 1 calc(50% - 20px);
                max-width: calc(50% - 20px);
            }
        }
        
        @media screen and (max-width: 480px) {
            .embed-wrapper {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
        
        .images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(to right, #e6f0ff, #ffffff);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .img-wrapper img {
            height: 200px;
            width: 200px;
            object-fit: cover;
            border: 3px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        
        .img-wrapper img:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
            border-color: #007bff;
        }
        
        @media (max-width: 768px) {
            .images {
                gap: 15px;
                padding: 20px;
            }
            .img-wrapper img {
                height: 150px;
                width: 150px;
                border-radius: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .img-wrapper img {
                height: 120px;
                width: 120px;
            }
        }
    </style>
</head>

<body>
    <h1>My Certificates</h1>
    <div class="container">
        <div class="embed-wrapper">
            <embed src="/file/computerscience1.pdf" type="application/pdf">
            <div class="file-title">Computer Science Certificate</div>
        </div>
        <div class="embed-wrapper">
            <embed src="/file/data structures.pdf" type="application/pdf">
            <div class="file-title">Data Structures Certificate</div>
        </div>
        <div class="embed-wrapper">
            <embed src="/file/fontend-UOM.pdf" type="application/pdf">
            <div class="file-title">Frontend Development Certificate</div>
        </div>
        <div class="embed-wrapper">
            <embed src="/file/Information Security.pdf" type="application/pdf">
            <div class="file-title">Information Security Certificate</div>
        </div>
        <div class="embed-wrapper">
            <embed src="/file/operatingsystem.pdf" type="application/pdf">
            <div class="file-title">Operating System Certificate</div>
        </div>
        <div class="embed-wrapper">
            <embed src="/file/Python_for_Beginners_E-Certificate (1).pdf" type="application/pdf">
            <div class="file-title">Python for Beginners</div>
        </div>
        <div class="embed-wrapper">
            <embed src="/file/UOM-web development.pdf" type="application/pdf">
            <div class="file-title">Web Development Certificate</div>
        </div>
    </div>




    <div class="images" id="image">
        <div class="img-wrapper">
            <img src="/images/img1.jpg" alt="Nature">
            <img src="/images/img2.jpg" alt="Group Meeting">
            <img src="/images/img 3.jpg" alt="Mall">
            <img src="/images/img3.jpg" alt="Person">
            <img src="/images/img1.jpg" alt="Nature">
            <img src="/images/img2.jpg" alt="Group Meeting">
            <img src="/images/img 3.jpg" alt="Mall">
            <img src="/images/img3.jpg" alt="Person">
            <img src="/images/img1.jpg" alt="Nature">
            <img src="/images/img2.jpg" alt="Group Meeting">
            <img src="/images/img 3.jpg" alt="Mall">
            <img src="/images/img3.jpg" alt="Person">
        </div>

    </div>


</body>

</html>
